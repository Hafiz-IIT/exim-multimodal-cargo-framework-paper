name: Manuscript Integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify manuscript source and protocol
        id: files
        run: |
          test -s "paper/main.tex"
          test -s "paper/EXPERIMENT_PROTOCOL.md"
          test -s "paper/abstract.md"
          test -s "paper/claims.md"
          test -s "paper/limitations.md"
          test -s "paper/reproducibility.md"
          test -s "Makefile"
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended
      - name: Compile manuscript
        id: compile
        run: make pdf
      - name: Fail workflow when integrity or compilation fails
        if: steps.files.outcome != 'success' || steps.compile.outcome != 'success'
        run: exit 1
