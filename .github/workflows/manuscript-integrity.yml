name: Manuscript Integrity
on:
  push:
  pull_request:
permissions:
  contents: read
  statuses: write
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify declared manuscript files
        id: files
        run: |
          test -f "paper/abstract.md"
          test -f "paper/system_architecture.md"
          test -f "paper/evidence_model.md"
          test -f "paper/claims.md"
          test -f "paper/limitations.md"
          test -f "paper/reproducibility.md"
      - name: Publish integrity status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          FILES_OUTCOME: ${{ steps.files.outcome }}
        run: |
          if [ "$FILES_OUTCOME" = "success" ]; then STATE=success; else STATE=failure; fi
          curl -fsSL -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{"state":"$STATE","context":"portfolio/manuscript-integrity","description":"GitHub Actions verified the manuscript scaffold files declared by README for the current commit","target_url":"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}"
      - name: Fail workflow when integrity check fails
        if: steps.files.outcome != 'success'
        run: exit 1
